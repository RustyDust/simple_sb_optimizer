name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        # HA >= 2026.11 needs Python >= 3.14.2
        run: uv python install 3.14
      - name: Install test requirements
        run: |
          uv venv -p 3.14 .venv
          uv pip install -p .venv -r requirements_test.txt
      - name: Show versions
        run: .venv/bin/python -c "import sys, homeassistant.const as c; print('Python', sys.version.split()[0], '- HA', c.__version__)"
      - name: Run tests
        run: .venv/bin/pytest -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # not listed in home-assistant/brands (no logo/icon submitted)
          ignore: brands
